<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Harmony Link 회원을 위한 한자 변환기">
  <meta name="theme-color" content="#0b5fc2">
  <title>한자 변환기 | Harmony Link</title>
  <link rel="icon" type="image/png" href="app/icon-512.png?v=2">
  <link rel="shortcut icon" type="image/png" href="app/icon-512.png?v=2">
  <link rel="apple-touch-icon" href="app/icon-512.png?v=2">
  <link rel="stylesheet" href="styles.css?v=20260916-19">
  <link rel="stylesheet" href="homepage-ui.css?v=20260916-16">
  <link rel="stylesheet" href="easy-hanja.css?v=20260916-30">
</head>
<body>
  <a class="skip-link" href="#hanjaMain">본문으로 바로가기</a>
  <header class="site-header tool-site-header" id="top">
    <div class="container nav-wrap">
      <a class="logo" href="./" aria-label="Harmony Link home">
        <span class="logo-mark brand-image" aria-hidden="true"><img src="assets/harmony-logo.png" alt=""></span>
        <span class="logo-name">Harmony <b>Link</b><small data-ko="이음문화센터" data-en="E-eum Culture Center">이음문화센터</small></span>
      </a>
      <div class="hanja-account-actions"><a class="header-login" href="./">홈페이지</a><button class="header-login hanja-signout" id="hanjaSignout" type="button" hidden>로그아웃</button></div>
    </div>
  </header>

  <main id="hanjaMain" class="hanja-main" data-member-tool="easy-hanja">
    <div class="hanja-container">
      <section class="hanja-hero" aria-labelledby="hanjaTitle">
        <p class="hanja-eyebrow">HARMONY LINK MEMBER TOOL</p>
        <a class="hanja-back" href="senior-mini-apps.html">← 미니앱</a>
        <h1 id="hanjaTitle">한자 변환기</h1>
        <p>한글을 입력하면 관련 한자를 쉽게 확인할 수 있어요.</p>
      </section>

      <section class="hanja-loading" id="hanjaLoading" aria-live="polite"><span aria-hidden="true">⏳</span> 회원 정보를 확인하고 있어요...</section>

      <section class="hanja-gate" id="hanjaGate" hidden aria-labelledby="hanjaGateTitle">
        <span class="hanja-gate-icon" aria-hidden="true">🔐</span>
        <h2 id="hanjaGateTitle">하모니링크 회원이면 무료로 사용할 수 있어요</h2>
        <p>회원가입 또는 로그인 후 바로 이용하실 수 있습니다.</p>
        <div class="hanja-gate-actions"><a class="hanja-button primary" href="index.html?auth=signup&amp;return=easy-hanja.html">무료 회원가입</a><a class="hanja-button secondary" href="index.html?auth=login&amp;return=easy-hanja.html">로그인</a></div>
      </section>

      <section class="hanja-app" id="hanjaApp" hidden aria-labelledby="hanjaSearchTitle">
        <div class="hanja-search-card">
          <label for="hanjaQuery" id="hanjaSearchTitle">한글을 입력하세요</label>
          <div class="hanja-search-row"><input id="hanjaQuery" type="text" inputmode="text" autocomplete="off" placeholder="한글을 입력하세요" maxlength="32"><button class="hanja-button primary" id="hanjaSearchButton" type="button">변환하기</button></div>
          <p class="hanja-hint">예: 학교 · 교육 · 문화 · 건강</p>
        </div>
        <p class="hanja-status" id="hanjaStatus" role="status" aria-live="polite"></p>
        <div class="hanja-results" id="hanjaResults" aria-live="polite"></div>
      </section>
    </div>
  </main>
  <footer class="hanja-footer">© 2026 Hibelle Consulting · Harmony Link</footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="hanja-dictionary.js?v=20260916-30"></script>
  <script src="easy-hanja.js?v=20260916-30"></script>
</body>
</html>
