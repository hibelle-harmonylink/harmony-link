<!doctype html>
<html lang="ko">
<head>
  <link rel="icon" type="image/png" href="/app/icon-512.png?v=2">
  <link rel="shortcut icon" href="/app/icon-512.png?v=2">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>회원 및 파트너 관리 | Harmony Link</title>
  <!-- admin.html had no cache-busting/auto-refresh of its own (unlike
       index.html), so a browser or intermediate cache could keep serving
       an old admin.html -- with old admin.js/admin.css query strings baked
       into it -- indefinitely, silently hiding every admin.js fix shipped
       after that snapshot was cached. Mirrors index.html's exact
       version.json polling pattern so a stale copy force-reloads itself. -->
  <script>
    (() => {
      const pageVersion = '20260905-3';
      fetch(`version.json?t=${Date.now()}`, { cache: 'no-store' })
        .then(response => response.ok ? response.json() : null)
        .then(release => {
          if (!release?.version || release.version === pageVersion) return;
          const latestUrl = new URL(window.location.href);
          if (latestUrl.searchParams.get('refresh') === release.version) return;
          latestUrl.searchParams.set('refresh', release.version);
          window.location.replace(latestUrl);
        })
        .catch(() => {});
    })();
  </script>
  <link rel="stylesheet" href="styles.css?v=20260905-3">
  <link rel="stylesheet" href="admin.css?v=20260904-7">
</head>
<body class="admin-page">
  <header class="admin-header">
    <a class="logo admin-brand" href="./"><span class="logo-mark brand-image" aria-hidden="true"><img src="assets/harmony-logo.png" alt=""></span><span class="logo-name">Harmony <b>Link</b><small>이음문화센터</small></span></a>
    <nav><a href="./">홈페이지</a><button id="adminSignOut" type="button" hidden>로그아웃</button></nav>
  </header>

  <main>
    <section class="admin-access" id="adminLoading">
      <span class="admin-access-icon">⏳</span><h1>관리자 권한을 확인하고 있습니다</h1><p>잠시만 기다려 주세요.</p>
    </section>
    <section class="admin-access" id="adminDenied" hidden>
      <span class="admin-access-icon">🔒</span><h1>관리자 전용 페이지입니다</h1><p id="adminDeniedMessage">관리자 계정으로 로그인해야 이용할 수 있습니다.</p><a class="btn btn-primary" href="./">홈페이지로 돌아가기</a>
    </section>

    <section class="admin-shell" id="adminApp" hidden>
      <div class="admin-title-row">
        <div><p class="eyebrow">ADMIN MEMBER CENTER</p><h1>회원 관리</h1><p>회원유형, 멤버십, 계정 상태와 기능 권한을 각각 관리합니다.</p></div>
        <div class="admin-summary" aria-label="회원 현황">
          <article><span>전체 회원</span><strong data-count="all">0</strong></article>
          <article><span>관리자</span><strong data-count="admin">0</strong></article>
          <article><span>프리미엄</span><strong data-count="premium">0</strong></article>
          <article><span>파트너</span><strong data-count="partner">0</strong></article>
          <article><span>수강생</span><strong data-count="student">0</strong></article>
        </div>
        <button class="admin-refresh" id="adminRefresh" type="button">새로고침 ↻</button>
      </div>

      <form class="admin-toolbar" id="adminFilters">
        <label><span>이름 또는 이메일 검색</span><input id="memberSearch" type="search" autocomplete="off" placeholder="이름 또는 이메일 입력"></label>
        <label><span>회원유형</span><select id="typeFilter"><option value="">전체 유형</option><option value="student">수강생</option><option value="partner">파트너</option></select></label>
        <label><span>멤버십</span><select id="membershipFilter"><option value="">전체 멤버십</option><option value="free">FREE</option><option value="basic">BASIC $20</option><option value="premium">PREMIUM $50</option></select></label>
        <label><span>계정 상태</span><select id="statusFilter"><option value="">전체 상태</option><option value="active">활성</option><option value="expiring">만료 예정</option><option value="expired">만료</option><option value="suspended">중지</option></select></label>
        <button class="btn btn-primary" type="submit">검색</button>
      </form>

      <div class="admin-message" id="adminMessage" role="status" aria-live="polite"></div>
      <div class="member-table-wrap"><table class="member-table"><thead><tr><th>이름</th><th>이메일</th><th>회원유형</th><th>멤버십</th><th>상태</th><th>가입일</th><th>관리</th></tr></thead><tbody id="memberList"></tbody></table></div>
      <div class="member-empty" id="memberEmpty" hidden>조건에 맞는 회원이 없습니다.</div>
    </section>
  </main>

  <dialog class="member-dialog" id="memberDialog" aria-labelledby="memberDialogTitle"><form method="dialog" class="member-dialog-head"><div><p class="eyebrow">MEMBER DETAIL</p><h2 id="memberDialogTitle">회원 상세</h2></div><button value="cancel" aria-label="닫기">×</button></form><div id="memberDetail"></div></dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="access-control.js?v=20260904-1"></script>
  <script src="admin.js?v=20260904-4"></script>
</body>
</html>
