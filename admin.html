<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>회원 및 파트너 관리 | Harmony Link</title>
  <link rel="stylesheet" href="styles.css?v=20260804-244">
  <link rel="stylesheet" href="admin.css?v=20260804-244">
</head>
<body class="admin-page">
  <header class="admin-header">
    <a class="admin-brand" href="./"><img src="assets/harmony-logo.png" alt="Harmony Link"><span>Harmony <b>Link</b></span></a>
    <nav><a href="./">홈페이지</a><button id="adminSignOut" type="button" hidden>로그아웃</button></nav>
  </header>

  <main>
    <section class="admin-access" id="adminLoading">
      <span class="admin-access-icon">⏳</span><h1>관리자 권한을 확인하고 있습니다</h1><p>잠시만 기다려 주세요.</p>
    </section>
    <section class="admin-access" id="adminDenied" hidden>
      <span class="admin-access-icon">🔒</span><h1>관리자 전용 페이지입니다</h1><p id="adminDeniedMessage">관리자 계정으로 로그인해야 이용할 수 있습니다.</p><a class="btn btn-primary" href="./">홈페이지로 돌아가기</a>
    </section>

    <section class="admin-shell" id="adminApp" hidden>
      <div class="admin-title-row"><div><p class="eyebrow">ADMIN MEMBER CENTER</p><h1>회원 및 파트너 관리</h1><p>회원 승인, 파트너 등급과 홈페이지 이용 상태를 안전하게 관리합니다.</p></div><button class="admin-refresh" id="adminRefresh" type="button">새로고침 ↻</button></div>

      <div class="admin-summary" aria-label="회원 현황">
        <article><span>전체 회원</span><strong data-count="all">0</strong></article>
        <article><span>미승인</span><strong data-count="member">0</strong></article>
        <article><span>무료 파트너</span><strong data-count="partner0">0</strong></article>
        <article><span>$20 BASIC</span><strong data-count="partner20">0</strong></article>
        <article><span>$50 PREMIUM</span><strong data-count="partner50">0</strong></article>
      </div>

      <form class="admin-toolbar" id="adminFilters">
        <label><span>이메일 검색</span><input id="memberSearch" type="search" autocomplete="off" placeholder="회원 이메일 입력"></label>
        <label><span>회원 등급</span><select id="roleFilter"><option value="">전체 등급</option><option value="member">미승인 일반회원</option><option value="partner0">무료 파트너</option><option value="partner20">$20 BASIC 파트너</option><option value="partner50">$50 PREMIUM 파트너</option><option value="admin">관리자</option></select></label>
        <button class="btn btn-primary" type="submit">검색</button>
      </form>

      <div class="admin-message" id="adminMessage" role="status" aria-live="polite"></div>
      <div class="member-list" id="memberList" aria-live="polite"></div>
      <div class="member-empty" id="memberEmpty" hidden>조건에 맞는 회원이 없습니다.</div>
    </section>
  </main>

  <template id="memberCardTemplate">
    <article class="member-card">
      <div class="member-main"><span class="member-role-badge"></span><h2 class="member-email"></h2><p class="member-id"></p></div>
      <dl class="member-dates"><div><dt>가입일시</dt><dd data-field="created_at"></dd></div><div><dt>최근 로그인</dt><dd data-field="last_sign_in_at"></dd></div><div><dt>파트너 승인일</dt><dd data-field="approved_at"></dd></div><div><dt>마지막 변경일</dt><dd data-field="updated_at"></dd></div></dl>
      <div class="member-actions"><label><span>회원 등급</span><select class="member-role-select"><option value="member">미승인 일반회원</option><option value="partner0">무료 파트너</option><option value="partner20">$20 BASIC 파트너</option><option value="partner50">$50 PREMIUM 파트너</option></select></label><button type="button" class="member-status-button"></button><button type="button" class="member-save btn btn-primary">변경 저장</button></div>
    </article>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="admin.js?v=20260804-244"></script>
</body>
</html>
