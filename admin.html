<!doctype html>
<html lang="ko">
<head>
  <link rel="icon" type="image/png" href="/app/icon-512.png?v=2">
  <link rel="shortcut icon" href="/app/icon-512.png?v=2">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>회원 및 파트너 관리 | Harmony Link</title>
  <!-- admin.html had no cache-busting/auto-refresh of its own (unlike
       index.html), so a browser or intermediate cache could keep serving
       an old admin.html -- with old admin.js/admin.css query strings baked
       into it -- indefinitely, silently hiding every admin.js fix shipped
       after that snapshot was cached. Mirrors index.html's exact
       version.json polling pattern so a stale copy force-reloads itself. -->
  <script>
    (() => {
      const pageVersion = '20260902-4';
      fetch(`version.json?t=${Date.now()}`, { cache: 'no-store' })
        .then(response => response.ok ? response.json() : null)
        .then(release => {
          if (!release?.version || release.version === pageVersion) return;
          const latestUrl = new URL(window.location.href);
          if (latestUrl.searchParams.get('refresh') === release.version) return;
          latestUrl.searchParams.set('refresh', release.version);
          window.location.replace(latestUrl);
        })
        .catch(() => {});
    })();
  </script>
  <link rel="stylesheet" href="styles.css?v=20260805-253">
  <link rel="stylesheet" href="admin.css?v=20260902-1">
</head>
<body class="admin-page">
  <header class="admin-header">
    <a class="logo admin-brand" href="./"><span class="logo-mark brand-image" aria-hidden="true"><img src="assets/harmony-logo.png" alt=""></span><span class="logo-name">Harmony <b>Link</b><small>이음문화센터</small></span></a>
    <nav><small id="adminBuildTag" style="opacity:.45;font-size:10px;margin-right:4px" title="현재 실행 중인 admin.js 빌드 -- 캐시된 옛 버전이 실행되고 있는지 확인할 때 사용"></small><a href="./">홈페이지</a><button id="adminSignOut" type="button" hidden>로그아웃</button></nav>
  </header>

  <main>
    <section class="admin-access" id="adminLoading">
      <span class="admin-access-icon">⏳</span><h1>관리자 권한을 확인하고 있습니다</h1><p>잠시만 기다려 주세요.</p>
    </section>
    <section class="admin-access" id="adminDenied" hidden>
      <span class="admin-access-icon">🔒</span><h1>관리자 전용 페이지입니다</h1><p id="adminDeniedMessage">관리자 계정으로 로그인해야 이용할 수 있습니다.</p><a class="btn btn-primary" href="./">홈페이지로 돌아가기</a>
    </section>

    <section class="admin-shell" id="adminApp" hidden>
      <div class="admin-title-row"><div><p class="eyebrow">ADMIN MEMBER CENTER</p><h1>회원 및 파트너 관리</h1><p>회원 승인, 파트너 등급과 홈페이지 이용 상태를 <br class="admin-mobile-break">안전하게 관리합니다.</p></div><button class="admin-refresh" id="adminRefresh" type="button">새로고침 ↻</button></div>

      <div class="admin-summary" aria-label="회원 현황">
        <article><span>전체 회원</span><strong data-count="all">0</strong></article>
        <article><span>일반회원</span><strong data-count="general">0</strong></article>
        <article><span>수강생</span><strong data-count="student">0</strong></article>
        <article><span>무료 파트너</span><strong data-count="partner0">0</strong></article>
        <article><span>$20 BASIC</span><strong data-count="partner20">0</strong></article>
        <article><span>$50 PREMIUM</span><strong data-count="partner50">0</strong></article>
        <article><span>Premium 회원 승인</span><strong data-count="premium">0</strong></article>
      </div>

      <form class="admin-toolbar" id="adminFilters">
        <label><span>이메일 검색</span><input id="memberSearch" type="search" autocomplete="off" placeholder="회원 이메일 입력"></label>
        <label><span>회원 유형</span><select id="typeFilter"><option value="">전체 유형</option><option value="general">일반회원</option><option value="student">수강생</option><option value="partner">입점 파트너</option><option value="admin">관리자</option></select></label>
        <label><span>파트너 등급</span><select id="roleFilter"><option value="">전체 등급</option><option value="member">등급 없음</option><option value="partner0">무료 파트너</option><option value="partner20">$20 BASIC 파트너</option><option value="partner50">$50 PREMIUM 파트너</option><option value="admin">관리자</option></select></label>
        <button class="btn btn-primary" type="submit">검색</button>
      </form>

      <div class="admin-message" id="adminMessage" role="status" aria-live="polite"></div>
      <div class="member-list" id="memberList" aria-live="polite"></div>
      <div class="member-empty" id="memberEmpty" hidden>조건에 맞는 회원이 없습니다.</div>
    </section>
  </main>

  <template id="memberCardTemplate">
    <article class="member-card">
      <div class="member-main"><span class="member-role-badge"></span><h2 class="member-email"></h2><p class="member-id"></p></div>
      <dl class="member-dates"><div><dt>가입일시</dt><dd data-field="created_at"></dd></div><div><dt>최근 로그인</dt><dd data-field="last_sign_in_at"></dd></div><div><dt>파트너 승인일</dt><dd data-field="approved_at"></dd></div><div><dt>마지막 변경일</dt><dd data-field="updated_at"></dd></div></dl>
      <div class="member-actions"><label class="member-name-field"><span>회원 이름</span><input class="member-name-input" type="text" minlength="2" maxlength="50" autocomplete="off" placeholder="사람 이름을 입력하세요"></label><label><span>회원 유형</span><select class="member-type-select"><option value="general">일반회원</option><option value="student">수강생</option><option value="partner">입점 파트너</option></select></label><label><span>파트너 등급</span><select class="member-role-select"><option value="member">등급 없음</option><option value="partner0">무료 파트너</option><option value="partner20">$20 BASIC 파트너</option><option value="partner50">$50 PREMIUM 파트너</option></select></label><button type="button" class="member-status-button"></button><button type="button" class="member-premium-button" title="AI 쇼츠 등 Premium 전용 기능 이용 승인 (파트너 등급과 무관)"></button><button type="button" class="member-save btn btn-primary">변경 저장</button><button type="button" class="member-resend">안내메일 다시 보내기</button></div>
    </article>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="admin.js?v=20260902-4"></script>
</body>
</html>
