<body class="dclass-page">

  <div class="dclass-container dclass-breadcrumb-bar">
    <p class="dclass-breadcrumb" id="breadcrumb"></p>
  </div>

  <main>
    <section class="dclass-section">
      <div class="dclass-container dclass-course-layout">
        <div class="dclass-course-heading">
          <h2>교육 과정</h2>
          <p class="dclass-program-summary" id="programSummary"></p>
        </div>
        <button class="dclass-course-flyer" id="programFlyerButton" type="button" aria-label="전단지 크게 보기">
          <img id="programFlyer" src="" alt="">
        </button>
        <div class="dclass-course-content">
          <div class="dclass-detail-grid" id="stepGrid"></div>

          <div id="shortsArea"></div>
          <div class="dclass-btn-row dclass-cta-area" id="ctaArea"></div>
        </div>
      </div>
    </section>
  </main>

  <div class="dclass-flyer-lightbox" id="flyerLightbox" role="dialog" aria-modal="true" aria-label="전단지 크게 보기" hidden>
    <button class="dclass-lightbox-close" id="flyerLightboxClose" type="button" aria-label="닫기">×</button>
    <img id="flyerLightboxImage" src="" alt="">
  </div>

  <footer class="dclass-footer">
    <div class="dclass-container">
      <p>하이벨 디지털은 하이벨컨설팅이 운영하는 Harmony Link 이음문화센터의 디지털 교육 프로그램입니다.</p>

    </div>
  </footer>
