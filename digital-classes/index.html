<!doctype html>
<html lang="ko">
<head>
  <link rel="icon" type="image/png" href="/app/icon-512.png?v=2">
  <link rel="shortcut icon" href="/app/icon-512.png?v=2">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>디지털 클래스 | Harmony Link</title>
<meta name="description" content="기기활용부터 AI까지, 하이벨 디지털의 클래스를 카테고리별로 확인해보세요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="style.css?v=3">
</head>
<body class="dclass-page">

  <section class="dclass-hero">
    <div class="dclass-container">
      <p class="dclass-eyebrow">HIBELLE DIGITAL CLASSES</p>
      <h1>디지털 클래스</h1>
      <p>스마트폰 기초부터 AI 활용까지, 필요한 주제를 골라 나에게 맞는 프로그램을 확인해보세요.</p>
      <div class="dclass-instructor-heading">
        <h2>대표 강사</h2>
      </div>
      <div class="dclass-instructor">
        <img src="../assets/teachers/noh-hyekyung.png" alt="노혜경 강사">
        <div class="dclass-instructor-copy">
          <h3>노혜경</h3>
          <p>AI·스마트폰 활용을 일상에 쉽게 적용할 수 있도록 친절하게 안내합니다.</p>
        </div>
      </div>
    </div>
  </section>

  <main>
    <section class="dclass-section">
      <div class="dclass-container">
        <div class="dclass-grid" id="categoryGrid"></div>
      </div>
    </section>
  </main>

  <footer class="dclass-footer">
    <div class="dclass-container">
      <p>하이벨 디지털은 하이벨컨설팅이 운영하는 Harmony Link 이음문화센터의 디지털 교육 프로그램입니다.</p>
    </div>
  </footer>

  <script src="data.js?v=2"></script>
  <script src="language.js?v=1"></script>
  <script>
    var dtext = window.digitalText;
    document.documentElement.lang = window.DIGITAL_LANGUAGE;
    document.title = dtext('디지털 클래스 | Harmony Link', 'Digital Classes | Harmony Link');
    document.querySelector('.dclass-hero h1').textContent = dtext('디지털 클래스', 'Digital Classes');
    document.querySelector('.dclass-hero>div>p:nth-of-type(2)').textContent = dtext('스마트폰 기초부터 AI 활용까지, 필요한 주제를 골라 나에게 맞는 프로그램을 확인해보세요.', 'Choose practical digital classes from smartphone basics to AI tools.');
    document.querySelector('.dclass-instructor-heading h2').textContent = dtext('대표 강사', 'Representative Instructor');
    document.querySelector('.dclass-instructor h3').textContent = dtext('노혜경', 'Hyekyung Noh');
    document.querySelector('.dclass-instructor-copy p').textContent = dtext('AI·스마트폰 활용을 일상에 쉽게 적용할 수 있도록 친절하게 안내합니다.', 'Friendly, practical guidance for applying AI and smartphone skills in everyday life.');
    document.querySelector('.dclass-footer p').textContent = dtext('하이벨 디지털은 하이벨컨설팅이 운영하는 Harmony Link 이음문화센터의 디지털 교육 프로그램입니다.', 'Hibelle Digital is a Harmony Link digital education program operated by Hibelle Consulting.');
    document.getElementById('categoryGrid').innerHTML = window.DIGITAL_CATEGORIES.all.map(function (c) {
      var primaryProgram = c.programs[0];
      var href = 'program.html?category=' + c.id + '&program=' + primaryProgram.id;
      return '<a class="dclass-card" href="' + href + '">' +
        '<div class="dclass-card-image"><img src="' + c.image + '" alt="' + c.title + '"></div>' +
        '<div class="dclass-card-body">' +
        '<div class="dclass-card-heading"><span class="dclass-card-icon">' + c.icon + '</span><h3>' + c.title + '</h3></div>' +
        '<p>' + c.shortDesc + '</p>' +
        '<span class="dclass-btn dclass-btn-primary dclass-card-btn">' + dtext('자세히 보기', 'View Details') + '</span>' +
        '</div></a>';
    }).join('');
  </script>
</body>
</html>
