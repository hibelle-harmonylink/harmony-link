  <script>
    (function () {
      var currentLanguage = localStorage.getItem('harmonyLanguage') || 'ko';
      var langButton = document.querySelector('.lang-toggle');
      function setLanguage(language) {
        currentLanguage = language;
        document.documentElement.lang = language;
        document.querySelectorAll('[data-ko][data-en]').forEach(function (el) {
          el.innerHTML = el.dataset[language];
        });
        document.querySelectorAll('[data-ko-src]').forEach(function (el) {
          el.src = el.dataset[language + 'Src'];
        });
        document.querySelectorAll('[data-ko-href]').forEach(function (el) {
          el.href = el.dataset[language + 'Href'];
        });
        if (langButton) {
          langButton.querySelectorAll('span').forEach(function (item, index) {
            item.classList.toggle('active', (language === 'ko' && index === 0) || (language === 'en' && index === 1));
          });
          langButton.setAttribute('aria-label', language === 'ko' ? 'Switch to English' : '한국어로 전환');
        }
        localStorage.setItem('harmonyLanguage', language);
      }
      if (langButton) {
        langButton.addEventListener('click', function () {
          setLanguage(currentLanguage === 'ko' ? 'en' : 'ko');
        });
      }
      setLanguage(currentLanguage);
    })();
  </script>
