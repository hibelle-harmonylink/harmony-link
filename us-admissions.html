<body>
  <header class="admissions-header">
    <div class="admissions-shell">
      <a class="logo" href="./" aria-label="Harmony Link 홈"><span class="logo-mark brand-image" aria-hidden="true"><img src="assets/harmony-logo.png" alt=""></span><span class="logo-name">Harmony <b>Link</b><small>이음문화센터</small></span></a>
      <a class="home-link" href="./#program-categories">← 배움과 서비스</a>
    </div>
  </header>
  <main>
    <section class="admissions-hero">
      <div class="admissions-shell">
        <p class="eyebrow">U.S. ADMISSIONS</p>
        <h1>미국 진학</h1>
        <p>미국 대학과 전문대학원 진학을 준비하는 분들을 위한 단계별 정보입니다.</p>
      </div>
    </section>
    <section class="admissions-shell admissions-section">
      <div class="section-title"><span>현재 제공 정보</span><h2>진학 분야를 선택하세요</h2></div>
      <!-- 진학(Admissions) hub: extensible card grid. Each card is one admissions
           path. "featured" = live content with a link to its own independent guide
           page (e.g. us-admissions/dental.html), never an in-page #hash anchor;
           "pending" = path is planned but not yet written up, shown as a plain
           non-linking <article> (no click handler, so it cannot 404). To add a new
           path later, add another .admissions-card following the dental card's
           pattern -- and once a second real card exists, drop admissions-grid-single
           below (that modifier only caps the lone card's width while it's alone). -->
      <div class="admissions-grid admissions-grid-single">
        <article class="admissions-card featured">
          <span class="status">정보 제공중</span><div class="card-icon">🦷</div>
          <h3>치과대학 진학</h3><p>Pre-Dental부터 DAT, ADEA AADSAS, 인터뷰까지 준비 흐름을 한눈에 확인하세요.</p>
          <a href="us-admissions/dental.html">치대 준비 가이드 보기 →</a>
        </article>
        <!-- "미 해군 지원" (pending) and HPSP (now in the dental guide's Scholarship
             section) used to also sit in this grid. The Navy admissions path itself
             is not written up anywhere else in the repository -- this only removes
             its hub listing, it does not delete a Navy content page that exists. -->
      </div>
    </section>
  </main>
  <footer><div class="admissions-shell"><span>© 2026 Hibelle Consulting · Harmony Link / 이음문화센터</span><a href="./">Harmony Link 홈으로</a></div></footer>
